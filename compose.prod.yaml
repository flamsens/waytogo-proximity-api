# Production: run the image published by GitHub Actions (no local build).
#   docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d
# IMAGE_TAG: `main` (latest main build, default), a version like `1.2.3`, or `latest` (newest release).
services:
  app:
    image: ghcr.io/flamsens/waytogo-proximity-api:${IMAGE_TAG:-main}
    restart: unless-stopped
    # Bound to localhost: put a reverse proxy (TLS) in front of it.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - mobility-data:/data
    environment:
      INGEST_INTERVAL_SECONDS: 3600 # minimum 60
      # STALE_AFTER_SECONDS: 10800   # default 3 × interval
      # RATE_LIMIT_PER_MINUTE: 120
      # BATCH_RATE_LIMIT_PER_MINUTE: 30
      # ARCHIVE_RETENTION_DAYS: 30   # 0 disables the archive
      # Rate limits per real client IP via X-Forwarded-For. Safe: the port is only reachable from this host (the proxy).
      # Set to 'false' if nothing proxies in front.
      TRUST_PROXY: 'true'

volumes:
  mobility-data:
